name: Deploy

# NOTE: the repo's default/production branch is `v2` (origin HEAD -> v2).
# This workflow previously ran on `main` only, so it never executed (0 runs).
# The website itself (apps/vite) deploys via Cloudflare Pages Git integration
# (project `miti-web`, production branch `v2`); CI verifies its build here and
# deploys the API worker via Wrangler.

on:
  push:
    branches:
      - v2
      - main
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    name: Web build check (apps/vite)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run --cwd ./apps/vite build

  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: './apps/api'
          packageManager: bun
          command: deploy ./src/index.ts --env production
